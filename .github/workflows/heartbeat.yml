name: SharBo Globo — Public Demo Heartbeat

# Independent monitor for the public GitHub Pages demo. It does not participate
# in generation; it only makes silent staleness visible.
on:
  schedule:
    - cron: "17 0 * * *"   # 08:17 Asia/Taipei
    - cron: "0 5 * * *"    # 13:00 Asia/Taipei backstop
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PUBLIC_SITE_URL: https://sidphoto.github.io/sharbo-globo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public demo date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          today=$(TZ=Asia/Taipei date +%F)
          payload=$(curl -fsSL -H 'Cache-Control: no-cache' "$PUBLIC_SITE_URL/data/latest.json" || echo '')
          if [ -n "$payload" ]; then
            live_date=$(printf '%s' "$payload" | python3 -c "import sys,json; p=json.load(sys.stdin); assert p.get('demo') is True; print(p.get('date',''))" 2>/dev/null || true)
          else
            live_date=""
          fi

          if [ "$live_date" = "$today" ]; then
            echo "heartbeat OK: public synthetic demo date=${live_date}"
            exit 0
          fi

          title="public demo stale/unhealthy: ${today}"
          body="Public demo heartbeat expected ${today}, but live data/latest.json reported '${live_date:-unreachable}'.\n\nCheck the Public Daily Demo and Pages workflows."
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still stale/unhealthy at $(date -u +%FT%TZ). Live date: ${live_date:-unreachable}."
          else
            gh issue create --title "$title" --body "$body" || true
          fi
          exit 1
