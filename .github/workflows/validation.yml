name: SharBo Globo Public Validation Gate

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Public contract, leak and i18n validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .[dev]
      - name: Compile Python
        run: python -m compileall -q scripts src tests
      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check personalization.js
          node --check quick_filters.js
          node --check topic_catalog.js
          node --check exploration.js
          node --check insight_widgets.js
          node --check github_source.js
          node --check render_security.js
      - name: Run JavaScript regressions
        run: |
          node tests/test_personalization.mjs
          node tests/test_quick_filters.mjs
          node tests/test_topics.mjs
          node tests/test_render_security.mjs
      - name: Run Python regressions
        run: python -m unittest discover -s tests -v
      - name: Run package tests
        run: pytest
      - name: Public repository leak gate
        run: python scripts/validate_public_repo.py
      - name: Validate multilingual contract
        run: python scripts/validate_i18n.py
      - name: Validate demo report contract
        run: python scripts/validate_report.py data/latest.json
      - name: Validate public JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('.').glob('config/*.json')) + sorted(Path('data').rglob('*.json')) + sorted(Path('locales').glob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK JSON: {path}')
          PY

      - name: Reject private production paths
        run: |
          forbidden='^(deploy/|ops/|config/source_registry\.json$)'
          if git ls-files | grep -E "$forbidden"; then
            echo "A private production path is tracked."
            exit 1
          fi
