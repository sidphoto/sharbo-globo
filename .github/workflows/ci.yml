name: Public Preview CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .[dev]
      - run: sharbo-validate examples/data/localization-bundle.json
      - run: pytest
      - name: Reject prohibited tracked paths
        shell: bash
        run: |
          forbidden='^(deploy/|ops/|config/source_registry\.json$)'
          if git ls-files | grep -E "$forbidden"; then
            echo "A private production path is tracked."
            exit 1
          fi
